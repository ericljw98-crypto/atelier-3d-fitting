<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATELIER · 杜嘉班纳 3D 试衣间</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 3L35 11V29L20 37L5 29V11L20 3Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 11L28 15.5V24.5L20 29L12 24.5V15.5L20 11Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 3V11M35 11L28 15.5M35 29L28 24.5M20 37V29M5 29L12 24.5M5 11L12 15.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">ATELIER</span>
          <span class="brand-sub">DOLCE &amp; GABBANA · 3D 试衣间</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="top-btn" id="btn-edit-model" title="编辑模特测量参数">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          编辑模特
        </button>
        <button class="top-btn" id="btn-reset" title="重置视角与造型">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          重置
        </button>
        <button class="top-btn primary" id="btn-snapshot" title="保存当前造型图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          保存造型
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="wardrobe panel">
        <div class="panel-heading">
          <h2>杜嘉班纳女装</h2>
          <p>48 款 · 点击试穿，数据驱动合身</p>
        </div>
        <button class="photo-entry" id="btn-photo-upload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.6"/><path d="M9 3l-1.2 4M15 3l1 4"/></svg>
          <span><b>照片识别换衣</b><small>上传衣服照片，识别颜色与款式</small></span>
          <svg class="photo-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="category-tabs" id="category-tabs"></div>
        <div class="garment-list" id="garment-list"></div>
      </aside>

      <section class="stage">
        <div class="stage-canvas" id="canvas-container">
          <div class="loading" id="loading">
            <div class="loading-ring"></div>
            <span>正在准备 3D 场景…</span>
          </div>
        </div>
        <div class="stage-overlay">
          <div class="stage-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="8"/></svg>
            拖拽旋转 · 滚轮缩放
          </div>
          <div class="stage-status" id="stage-status">未着装</div>
        </div>
      </section>

      <aside class="controls panel">
        <div class="panel-heading">
          <h2>造型控制</h2>
          <p>基于你的模特档案</p>
        </div>

        <div class="model-chip" id="model-chip">未建档</div>

        <div class="control-group">
          <h3>尺码</h3>
          <div class="size-buttons" id="size-buttons"></div>
          <p class="size-hint" id="size-hint"></p>
        </div>

        <div class="control-group">
          <h3>服饰颜色</h3>
          <div class="color-swatches" id="color-swatches"></div>
        </div>

        <div class="control-group">
          <h3>视角</h3>
          <div class="segmented" id="view-buttons">
            <button data-view="front" class="active">正面</button>
            <button data-view="side">侧面</button>
            <button data-view="back">背面</button>
          </div>
        </div>

        <div class="control-group">
          <h3>当前搭配</h3>
          <div class="outfit-summary" id="outfit-summary"></div>
        </div>

        <button class="btn-clear" id="btn-clear">清空着装</button>
      </aside>
    </div>
  </div>

  <!-- 照片识别弹窗 -->
  <div class="modal-backdrop" id="photo-modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>照片识别换衣</h2>
          <p>上传衣服照片，自动识别颜色与款式并匹配杜嘉班纳数据库</p>
        </div>
        <button class="modal-close" id="photo-modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="drop-zone" id="drop-zone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <p>点击选择图片，或拖拽照片到这里</p>
        <span>支持 JPG / PNG / WEBP，自动识别主体颜色与款式</span>
      </div>
      <!-- 关键修复：文件输入框置于 drop-zone 之外，避免点击事件冒泡递归 -->
      <input type="file" id="photo-file" accept="image/*" hidden />

      <div class="scan-result" id="scan-result" hidden>
        <div class="scan-preview">
          <img id="scan-img" alt="上传的衣服照片" />
          <div class="scan-badge" id="scan-badge">识别完成</div>
        </div>
        <div class="scan-info">
          <div class="scan-field">
            <span class="scan-label">识别颜色</span>
            <div class="scan-detected-color"><span class="detected-swatch" id="detected-swatch"></span><span id="detected-color-name">—</span></div>
          </div>
          <div class="scan-field">
            <span class="scan-label">推测版型</span>
            <div class="scan-detected-type" id="detected-type-name">—</div>
          </div>
          <div class="scan-field">
            <span class="scan-label">匹配款式</span>
            <div class="scan-detected-spec" id="detected-spec">—</div>
            <select id="detected-match" class="match-select"></select>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="photo-reselect">重新选择</button>
        <button class="btn-primary" id="photo-apply" disabled>试穿到模特</button>
      </div>
    </div>
  </div>

  <!-- 建档向导弹窗 -->
  <div class="modal-backdrop profile-backdrop" id="profile-modal">
    <div class="modal profile-modal">
      <div class="modal-head">
        <div>
          <h2 id="profile-title">建立模特档案</h2>
          <p id="profile-subtitle">请填写身体测量数据</p>
        </div>
      </div>
      <div class="profile-live">
        <div class="profile-live-label">当前档案</div>
        <div class="profile-live-value" id="profile-live-summary">—</div>
        <div class="profile-rec" id="profile-rec-size">推荐尺码 —</div>
      </div>
      <form class="profile-form" id="profile-form" onsubmit="return false"></form>
      <div class="modal-actions">
        <button class="btn-secondary" id="profile-cancel">取消</button>
        <button class="btn-primary" id="profile-save">创建模特并开始</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="assets/app.bundle.js"></script>
</body>
</html>
